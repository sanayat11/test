<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-карточка лида для CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Добавление лида</h1>
        <form id="leadForm" novalidate>
            <div id="messageArea" class="message hidden"></div>
            
            <div class="form-group">
                <label for="name">Имя клиента *</label>
                <input type="text" id="name" name="name" required placeholder="Иван Иванов">
            </div>

            <div class="form-group">
                <label for="phone">Номер телефона *</label>
                <input type="tel" id="phone" name="phone" required placeholder="+7 (999) 000-00-00">
            </div>

            <div class="form-group">
                <label for="source">Источник лида</label>
                <select id="source" name="source">
                    <option value="Холодный" selected>Холодный</option>
                    <option value="Тёплый">Тёплый</option>
                </select>
            </div>

            <div class="form-group">
                <label for="responsible">Ответственный</label>
                <select id="responsible" name="responsible">
                    <option value="Лидоруб" selected>Лидоруб</option>
                    <option value="МОП">МОП</option>
                </select>
            </div>

            <div class="form-group">
                <label for="stage">Этап сделки</label>
                <select id="stage" name="stage">
                    <option value="Новый лид" selected>Новый лид</option>
                    <option value="Квалифицирован">Квалифицирован</option>
                    <option value="Назначена консультация">Назначена консультация</option>
                    <option value="Отказ">Отказ</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="specificationRequested" name="specificationRequested">
                <label for="specificationRequested">Запрошено ТЗ</label>
            </div>

            <button type="submit" class="btn-submit">Сохранить</button>
        </form>

        <div class="leads-section">
            <div class="leads-header">
                <h2>Сохранённые лиды <span id="leadsCount" class="leads-count">(0)</span></h2>
            </div>
            <div id="emptyMessage" class="empty-message">Сохранённых лидов пока нет</div>
            <div id="leadsContainer" class="leads-container"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
